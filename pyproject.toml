[project]
name = "fde-datamigration-agent"
version = "0.1.0"
description = "Supervised, auditable employee data migration agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2",
    "langsmith>=0.2,<1",
    "langgraph>=0.2,<2",
    "langchain-google-genai>=2,<4",
    "python-dotenv>=1,<2",
    "python-multipart>=0.0.20,<1",
    "openpyxl>=3.1,<4",
    "langchain-core>=1.6.3",
    "pandas>=3.0.6",
    "phonenumbers>=9.0.39",
    "jsonschema>=4.26.0",
    "pytest>=8.4.2",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["evals", "backend/tests"]
pythonpath = ["."]
