<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Migration Control Room</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><p class="eyebrow">SUPERVISED MIGRATION</p><h1>Migration Control Room</h1><p>Autonomy with visible decision boundaries.</p></header><section class="actions"><button id="start">Start demo migration</button><button id="push" disabled>Push approved records</button><button id="retry" disabled>Retry failed records</button><button id="rollback" disabled class="danger">Rollback batch</button></section><p id="notice" role="status">Ready to ingest sample exports.</p><div class="grid"><section><h2>Run status</h2><div id="summary" class="card">No migration run yet.</div><h2>Activity</h2><ol id="events" class="card"></ol></section><section><h2>Review queue</h2><div id="reviews" class="card">Nothing awaiting review.</div><h2>Target outcomes</h2><div id="outcomes" class="card">No target calls yet.</div></section></div></main><script src="app.js"></script></body></html>
